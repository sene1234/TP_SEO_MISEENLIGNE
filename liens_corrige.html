    <title>TP6 - Maillage interne et attribut rel</title>

<body>

    <!-- 1. Lien interne avec une ancre descriptive -->
    <a href="/blog/article-42">notre guide complet du tissu wax</a>

    <!-- 2. Lien publicitaire (partenaire paye) avec rel="sponsored" -->

    <!-- 3. Lien poste par un utilisateur (commentaire/forum) avec rel="ugc" -->

</html>
